project_name: ignite

builds:
  - id: ignite
    main: ./cmd/ignite
    binary: ignite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: ignite
    ids: [ignite]
    formats: [tar.gz]
    name_template: "ignite_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: touchmeangel
    name: ignite_orchestrator